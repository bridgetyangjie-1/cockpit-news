<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <title>Tag Trends</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>tailwind.config = { darkMode: "class", theme: { extend: { colors: { background: "#0D0F12", surface: "#111317", "surface-container": "#1e2023", "surface-container-low": "#1a1c1f", primary: "#00F2FF", "on-surface": "#e2e2e6", "on-surface-variant": "#b9cacb" } } } }</script>
    <style>body { background-color: #0D0F12; }</style>
</head>
<body class="bg-background text-on-surface font-sans p-6 pb-20">
    <h1 class="text-3xl font-bold mb-2 tracking-tight">📊 Tag Trends</h1>
    <p class="text-sm text-on-surface-variant mb-6">Track industry trends</p>
    <div class="flex gap-2 mb-6">
        <button id="btn-monthly" onclick="showMonthly()" class="px-4 py-2 rounded-lg text-sm font-medium bg-primary/20 text-primary border border-primary/30">Monthly</button>
        <button id="btn-yearly" onclick="showYearly()" class="px-4 py-2 rounded-lg text-sm font-medium bg-surface-container-high text-on-surface-variant hover:bg-surface-container-high/80">Yearly</button>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
        <div class="bg-surface-container-low border border-outline-variant rounded-2xl p-6">
            <h2 class="text-lg font-semibold mb-4">🏷️ Top Tags</h2>
            <div class="space-y-3">
            <div class="flex items-center gap-4 mb-3">
                <span class="text-sm font-mono text-primary w-8">1.</span>
                <span class="text-sm font-mono text-on-surface w-24 truncate">OTA</span>
                <div class="flex-1 h-6 bg-surface-container-high rounded overflow-hidden">
                    <div class="h-full bg-gradient-to-r from-primary/50 to-primary transition-all duration-300" style="width: 100%"></div>
                </div>
                <span class="text-sm text-on-surface-variant w-12 text-right">84</span>
            </div>
            
            <div class="flex items-center gap-4 mb-3">
                <span class="text-sm font-mono text-primary w-8">2.</span>
                <span class="text-sm font-mono text-on-surface w-24 truncate">大模型</span>
                <div class="flex-1 h-6 bg-surface-container-high rounded overflow-hidden">
                    <div class="h-full bg-gradient-to-r from-primary/50 to-primary transition-all duration-300" style="width: 29%"></div>
                </div>
                <span class="text-sm text-on-surface-variant w-12 text-right">25</span>
            </div>
            
            <div class="flex items-center gap-4 mb-3">
                <span class="text-sm font-mono text-primary w-8">3.</span>
                <span class="text-sm font-mono text-on-surface w-24 truncate">语音交互</span>
                <div class="flex-1 h-6 bg-surface-container-high rounded overflow-hidden">
                    <div class="h-full bg-gradient-to-r from-primary/50 to-primary transition-all duration-300" style="width: 28%"></div>
                </div>
                <span class="text-sm text-on-surface-variant w-12 text-right">24</span>
            </div>
            
            <div class="flex items-center gap-4 mb-3">
                <span class="text-sm font-mono text-primary w-8">4.</span>
                <span class="text-sm font-mono text-on-surface w-24 truncate">语音助手</span>
                <div class="flex-1 h-6 bg-surface-container-high rounded overflow-hidden">
                    <div class="h-full bg-gradient-to-r from-primary/50 to-primary transition-all duration-300" style="width: 28%"></div>
                </div>
                <span class="text-sm text-on-surface-variant w-12 text-right">24</span>
            </div>
            
            <div class="flex items-center gap-4 mb-3">
                <span class="text-sm font-mono text-primary w-8">5.</span>
                <span class="text-sm font-mono text-on-surface w-24 truncate">蔚来</span>
                <div class="flex-1 h-6 bg-surface-container-high rounded overflow-hidden">
                    <div class="h-full bg-gradient-to-r from-primary/50 to-primary transition-all duration-300" style="width: 23%"></div>
                </div>
                <span class="text-sm text-on-surface-variant w-12 text-right">20</span>
            </div>
            
            <div class="flex items-center gap-4 mb-3">
                <span class="text-sm font-mono text-primary w-8">6.</span>
                <span class="text-sm font-mono text-on-surface w-24 truncate">手车互联</span>
                <div class="flex-1 h-6 bg-surface-container-high rounded overflow-hidden">
                    <div class="h-full bg-gradient-to-r from-primary/50 to-primary transition-all duration-300" style="width: 23%"></div>
                </div>
                <span class="text-sm text-on-surface-variant w-12 text-right">20</span>
            </div>
            
            <div class="flex items-center gap-4 mb-3">
                <span class="text-sm font-mono text-primary w-8">7.</span>
                <span class="text-sm font-mono text-on-surface w-24 truncate">小米</span>
                <div class="flex-1 h-6 bg-surface-container-high rounded overflow-hidden">
                    <div class="h-full bg-gradient-to-r from-primary/50 to-primary transition-all duration-300" style="width: 23%"></div>
                </div>
                <span class="text-sm text-on-surface-variant w-12 text-right">20</span>
            </div>
            
            <div class="flex items-center gap-4 mb-3">
                <span class="text-sm font-mono text-primary w-8">8.</span>
                <span class="text-sm font-mono text-on-surface w-24 truncate">多模态交互</span>
                <div class="flex-1 h-6 bg-surface-container-high rounded overflow-hidden">
                    <div class="h-full bg-gradient-to-r from-primary/50 to-primary transition-all duration-300" style="width: 22%"></div>
                </div>
                <span class="text-sm text-on-surface-variant w-12 text-right">19</span>
            </div>
            
            <div class="flex items-center gap-4 mb-3">
                <span class="text-sm font-mono text-primary w-8">9.</span>
                <span class="text-sm font-mono text-on-surface w-24 truncate">华为</span>
                <div class="flex-1 h-6 bg-surface-container-high rounded overflow-hidden">
                    <div class="h-full bg-gradient-to-r from-primary/50 to-primary transition-all duration-300" style="width: 21%"></div>
                </div>
                <span class="text-sm text-on-surface-variant w-12 text-right">18</span>
            </div>
            
            <div class="flex items-center gap-4 mb-3">
                <span class="text-sm font-mono text-primary w-8">10.</span>
                <span class="text-sm font-mono text-on-surface w-24 truncate">小鹏</span>
                <div class="flex-1 h-6 bg-surface-container-high rounded overflow-hidden">
                    <div class="h-full bg-gradient-to-r from-primary/50 to-primary transition-all duration-300" style="width: 20%"></div>
                </div>
                <span class="text-sm text-on-surface-variant w-12 text-right">17</span>
            </div>
            </div>
        </div>
        <div class="bg-surface-container-low border border-outline-variant rounded-2xl p-6">
            <h2 class="text-lg font-semibold mb-4">📈 Trend Chart</h2>
            <div class="h-64"><canvas id="trendChart"></canvas></div>
        </div>
    </div>
    <script>
        const monthlyLabels = ["2026-05", "2026-06", "2026-07", "2026-08"];
        const monthlyDatasets = [{"label": "OTA", "data": [23, 30, 25, 6], "borderColor": "#00F2FF", "backgroundColor": "#00F2FF20", "tension": 0.4, "fill": false}, {"label": "\u5927\u6a21\u578b", "data": [6, 7, 10, 2], "borderColor": "#FF6B6B", "backgroundColor": "#FF6B6B20", "tension": 0.4, "fill": false}, {"label": "\u8bed\u97f3\u4ea4\u4e92", "data": [4, 14, 6, 0], "borderColor": "#4ECDC4", "backgroundColor": "#4ECDC420", "tension": 0.4, "fill": false}, {"label": "\u8bed\u97f3\u52a9\u624b", "data": [4, 11, 6, 3], "borderColor": "#FFE66D", "backgroundColor": "#FFE66D20", "tension": 0.4, "fill": false}, {"label": "\u851a\u6765", "data": [6, 10, 4, 0], "borderColor": "#95E1D3", "backgroundColor": "#95E1D320", "tension": 0.4, "fill": false}];
        const yearlyLabels = ["2026"];
        const yearlyDatasets = [{"label": "OTA", "data": [84], "borderColor": "#00F2FF", "backgroundColor": "#00F2FF20", "tension": 0.4, "fill": false}, {"label": "\u5927\u6a21\u578b", "data": [25], "borderColor": "#FF6B6B", "backgroundColor": "#FF6B6B20", "tension": 0.4, "fill": false}, {"label": "\u8bed\u97f3\u4ea4\u4e92", "data": [24], "borderColor": "#4ECDC4", "backgroundColor": "#4ECDC420", "tension": 0.4, "fill": false}, {"label": "\u8bed\u97f3\u52a9\u624b", "data": [24], "borderColor": "#FFE66D", "backgroundColor": "#FFE66D20", "tension": 0.4, "fill": false}, {"label": "\u851a\u6765", "data": [20], "borderColor": "#95E1D3", "backgroundColor": "#95E1D320", "tension": 0.4, "fill": false}];
        const ctx = document.getElementById('trendChart').getContext('2d');
        const trendChart = new Chart(ctx, {
            type: 'line',
            data: { labels: monthlyLabels, datasets: monthlyDatasets },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { labels: { color: '#b9cacb' } } },
                scales: {
                    x: { ticks: { color: '#b9cacb' }, grid: { color: '#3a494b30' } },
                    y: { ticks: { color: '#b9cacb' }, grid: { color: '#3a494b30' } }
                }
            }
        });
        function showMonthly() {
            trendChart.data.labels = monthlyLabels; trendChart.data.datasets = monthlyDatasets; trendChart.update();
            document.getElementById('btn-monthly').className = 'px-4 py-2 rounded-lg text-sm font-medium bg-primary/20 text-primary border border-primary/30';
            document.getElementById('btn-yearly').className = 'px-4 py-2 rounded-lg text-sm font-medium bg-surface-container-high text-on-surface-variant hover:bg-surface-container-high/80';
        }
        function showYearly() {
            trendChart.data.labels = yearlyLabels; trendChart.data.datasets = yearlyDatasets; trendChart.update();
            document.getElementById('btn-yearly').className = 'px-4 py-2 rounded-lg text-sm font-medium bg-primary/20 text-primary border border-primary/30';
            document.getElementById('btn-monthly').className = 'px-4 py-2 rounded-lg text-sm font-medium bg-surface-container-high text-on-surface-variant hover:bg-surface-container-high/80';
        }
    </script>
</body>
</html>
